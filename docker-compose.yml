# Local production-like stack: PostgreSQL, the API, a separate worker, MinIO (S3-compatible export
# target) and HAPI FHIR (custom FHIR export target). Copy .env.example to .env and fill the secrets
# (generate them with `pnpm --filter @infinimed/server keys:generate`).
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: infinimed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinimed-dev}
      POSTGRES_DB: infinimed
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinimed"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://infinimed:${POSTGRES_PASSWORD:-infinimed-dev}@postgres:5432/infinimed
      WORKER_INLINE: "false"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://infinimed:${POSTGRES_PASSWORD:-infinimed-dev}@postgres:5432/infinimed
    command: ["node", "--import", "tsx", "src/worker-main.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: infinimed
      MINIO_ROOT_PASSWORD: infinimed-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  hapi:
    image: hapiproject/hapi:v8.4.0-1
    ports: ["8090:8080"]

volumes:
  pgdata:
  miniodata:
